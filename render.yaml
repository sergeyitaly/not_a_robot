# Render Blueprint for the dry-run demo (Render looks for this file at
# the repo root by default). Deploy: on Render, "New +" -> "Blueprint",
# connect this repo, it picks this file up automatically. Or with the
# CLI: `render blueprint launch`.
#
# Free-tier notes, deliberately not worked around:
# - Filesystem is ephemeral on the free plan -- AutoRetrainStore's
#   session log/model reset on every redeploy or cold start after the
#   service spins down from inactivity. Fine for a public demo (self-
#   limiting against unbounded growth from real traffic); if you want
#   state to survive, add a paid persistent disk mounted at
#   NOT_A_ROBOT_STORE's path.
# - The free plan spins the service down after 15 minutes idle; the
#   first request after that cold-starts it (image already has
#   Chromium + the seeded baseline model built in, so this is a Render
#   platform delay, not an app one).
# - The free plan's 0.1 vCPU is genuinely weak for this app's default
#   CV depth (2 seeds x 3 splits x 2 repeats, x3 more for isotonic
#   calibration's own internal folds per fit): measured taking multiple
#   minutes per "Run Tests" click in practice, which is a bad experience
#   even though it does eventually complete and save state correctly.
#   The env vars below run a lighter CV depth on this deployment only --
#   local Docker/plain-run keeps the full depth (app.py's own defaults).
services:
  - type: web
    name: not-a-robot-demo
    runtime: docker
    dockerfilePath: ./dry-run/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: NOT_A_ROBOT_STORE
        value: /app/dry-run-data
      - key: NOT_A_ROBOT_CV_SEEDS
        value: "0"
      - key: NOT_A_ROBOT_CV_N_SPLITS
        value: "2"
      - key: NOT_A_ROBOT_CV_N_REPEATS
        value: "1"
      - key: NOT_A_ROBOT_COOLDOWN_SECONDS
        value: "90"
      # Anonymous public traffic grows the session log without limit,
      # and a retrain fits on what's in it -- so without a window each
      # retrain is slower than the last until none finish at all (this
      # deployment reached exactly that state: 120 sessions recorded
      # across 6 clicks with no completed retrain for ~3 hours). A
      # window makes retrain cost constant no matter how many visitors
      # click. Local/Docker runs leave it unset and keep training on
      # everything.
      - key: NOT_A_ROBOT_MAX_TRAINING_SESSIONS
        value: "200"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "not-a-robot"
version = "0.1.2"
description = "Behavioral-telemetry feature extraction and ML scoring for a bot-verification system you run yourself."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["bot-detection", "behavioral-biometrics", "captcha", "fraud-detection", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.urls]
Repository = "https://github.com/sergeyitaly/not_a_robot"
Issues = "https://github.com/sergeyitaly/not_a_robot/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
